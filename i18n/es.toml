# ------------------------------------------------------------------ home page
[home]
eyebrow = "W4VE / documentación"
tagline = "Instala y corre un servidor técnico de Fabric, con sus mods y plugins de MCDReforged, sin cambiar el juego vanilla."
cta_start = "Empezar"
cta_catalog = "Ver el catálogo"

stat_pieces = "piezas en el catálogo"
stat_mods = "mods de Fabric"
stat_plugins = "plugins de MCDR"
stat_ours = "escritas por nosotros"

install_title = "Tres comandos"
install_body = "De nada a un servidor Fabric andando. Linux (vale una VM o un contenedor) y Python 3.11 o más nuevo, solo la librería estándar."
point_title = "Después"
c_cd = "o una carpeta vacía"
c_init = "mira primero, enseña el plan y después lo prepara"
c_run = "arranca el servidor y lo cuida"
c_install = "añade una pieza, y pregunta lo que necesita saber"
c_status = "qué está corriendo y qué espera un reinicio"
c_doctor = "busca problemas"
c_update = "lleva todo a su versión más nueva"
c_selfupdate = "actualiza el propio W4VE"
after_body = "w4ve help enseña el resto. Cada pregunta también se puede contestar con un flag, para scripts."
adopt_title = "No cambia nada hasta que digas que sí"
adopt_body = "<code>w4ve init</code> dice qué encontró (un servidor que ya existe, MCDR y sus plugins, la versión de Minecraft, Java, tus mods) y qué va a hacer, antes de hacer nada. Nunca mueve ni borra un archivo. En una carpeta vacía ofrece montar un servidor Fabric nuevo, El EULA de Minecraft lo aceptas tú; W4VE nunca lo acepta por ti."
catalog_title = "Qué hay en el catálogo"
catalog_body = "{n} piezas: {mods} mods de Fabric, {plugins} plugins de MCDReforged, y las herramientas y bots de alrededor. Probado en Minecraft {targets}, las versiones que corren nuestros propios servidores."
nav_catalog = "Cada pieza, qué necesita y con qué choca."
nav_profiles = "Un servidor técnico entero en un comando."
nav_commands = "La referencia, generada desde el propio CLI."
why_title = "Por qué existe esto"
why_body = "Llevar un servidor técnico suele significar wrappers, jars copiados a mano y una configuración que solo conoce una persona. W4VE corre el proceso del servidor, sabe qué tiene instalado y cómo volver atrás, y corre tus plugins de MCDReforged sin MCDR. Tu mundo y tus archivos siguen siendo archivos normales: si dejas de usar W4VE, el servidor sigue arrancando con Java a secas."

