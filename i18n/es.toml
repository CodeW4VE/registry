# The catalog itself (pieces.toml, index.json) stays in English: the CLI reads
# it, and so does everybody who is not us. This file is only for the website.
#
# Anything missing here falls back to the English text instead of breaking, so
# a new piece shows up in the Spanish pages the day it is added, untranslated,
# and can be translated later.
#
# Rule for the prose: plain technical Spanish, no em dashes.

