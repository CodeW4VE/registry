# ------------------------------------------------------------------ home page
[home]
eyebrow = "W4VE / documentación"
tagline = "Herramientas para servidores técnicos de Minecraft que no rompen el vanilla."
cta_start = "Empezar"
cta_catalog = "Ver el catálogo"

stat_pieces = "piezas en el catálogo"
stat_mods = "mods de Fabric"
stat_plugins = "plugins de MCDR"
stat_ours = "escritas por nosotros"

install_title = "Instala el comando"
install_body = "Un solo archivo, librería estándar y nada más, Python 3.8 o más nuevo. Sin pip, sin virtualenv, sin nada que instalar antes."
point_title = "Apúntalo a un servidor"
c_init = "escribe w4ve.toml"
c_adopt = "apunta los mods que el servidor ya tiene"
c_install = "lo descarga y lo pone donde va"
c_status = "qué hay instalado y qué espera un reinicio"
c_doctor = "qué está mal, antes de que lo descubra el servidor"
adopt_title = "Lee lo que ya hay puesto"
adopt_body = "<code>w4ve adopt</code> abre cada jar y lee el manifiesto de dentro en vez de adivinar por el nombre del archivo, así que un servidor que llevas un año corriendo se entiende tal como está, y los mods que no reconoce los deja en paz."
catalog_title = "Qué hay en el catálogo"
catalog_body = "{n} piezas: {mods} mods de Fabric, {plugins} plugins de MCDReforged, y las herramientas y bots de alrededor. Al día para Minecraft {targets}, porque son las versiones que corren nuestros propios servidores."
nav_catalog = "Cada pieza, qué necesita y con qué se niega a convivir."
nav_profiles = "Un servidor técnico entero en un comando."
nav_commands = "La referencia, generada desde el propio CLI."
why_title = "Por qué existe esto"
why_body = "Estas herramientas fueron naciendo de una en una mientras llevábamos un servidor técnico, y durante un tiempo la única forma de instalarlas era saberse de memoria qué jar iba dónde. El catálogo es ese conocimiento escrito en un sitio, y el comando es lo que lo lee."

