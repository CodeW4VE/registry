[profiles.technical-client]
name = "Cliente de jugador técnico"
description = "Lo que hay que poner en tu propia instancia para jugar en uno de estos servidores."

[profiles.minewave]
name = "MineWave"
description = "Exactamente lo que corre en el servidor de survival de MineWave. Sin trampa: si no está aquí, no está en el servidor."

# --------------------------------------------------------------------- pieces
[pieces.architectury-api]
summary = "Capa de compatibilidad contra la que se compilan los mods multiplataforma."

[pieces.axiom]
summary = "Editor de mundo todo en uno, con una mitad de servidor para que lo use un equipo de builders entero."

[pieces.beaconator]
summary = "Planifica perímetros de beacons: retícula de anillos desde un punto, volúmenes de cobertura reales y haces donde todavía falta un beacon."
blurb = "Planifica un perímetro de beacons antes de colocar el primero: retícula de anillos desde un punto, volúmenes de cobertura reales y haces disparando hacia arriba donde todavía falta un beacon."

[pieces.beep]
summary = "Le suena un pitido al jugador al que le están hablando, para que nadie se pierda un mensaje."

[pieces.bluemap]
summary = "Construye un modelo 3D del mundo y lo sirve como mapa web."

[pieces.botinventory-carpet]
summary = "Ver y manejar el inventario y la ender chest de los jugadores falsos, con clic derecho o por comando. Addon de Carpet."
blurb = "Ver y manejar el inventario y la ender chest de los jugadores falsos, con clic derecho o por comando, sin parar la granja."

[pieces.buildevents]
summary = "Cuenta los bloques puestos y rotos dentro de un área, para eventos de construcción."

[pieces.carpet]
summary = "La caja de herramientas del jugador técnico: jugadores falsos, control de ticks, cientos de reglas."

[pieces.carpet-ams-addition]
summary = "Extensión de Carpet de AMS con reglas y herramientas extra para juego técnico."

[pieces.carpet-extra]
summary = "Reglas de Carpet que no cabían en el mod base."

[pieces.carpet-tis-addition]
summary = "El addon de Carpet de TIS Union: herramientas y arreglos extra para servidores técnicos."

[pieces.chatbridge]
summary = "Puente de chat entre servidores de Minecraft y Discord, con avatares de cuerpo entero, mute por jugador y emotes entre servidores."
blurb = "Puente de chat entre Discord y Minecraft: los jugadores de MC aparecen como ellos mismos en Discord, con mute por jugador y emotes entre servidores."

[pieces.chunk-debug]
summary = "Mapa en vivo del estado de carga de los chunks en cualquier dimensión. Hace falta en los dos lados."

[pieces.command-suggest]
summary = "Sugiere el comando correcto cuando alguien lo escribe casi bien."

[pieces.daycount-nbt]
summary = "Lee el contador de días del mundo directo del NBT, así que sobrevive a reinicios y reseteos."

[pieces.deepslate-instamine]
summary = "La deepslate se rompe al instante con pico de netherita Eficiencia V y Prisa II."

[pieces.digall]
summary = "Total real de bloques picados para DiggyScoreboard, contando jugadores desconectados e históricos, sin los bots."
blurb = "Un total real de bloques picados para [DiggyScoreboard](https://github.com/Fallen-Breath/DiggyScoreboard), contando también a los jugadores desconectados e históricos, sin los bots."

[pieces.discord-todo-board]
summary = "Bot de Discord autoalojado: un tablero de proyectos vivo dentro de un canal, todo con botones. Uno o varios tableros, webhook HTTP opcional."
blurb = "Un tablero de proyectos vivo dentro de un canal de Discord, todo con botones, sin app web. Un tablero o varios, con webhook HTTP opcional."

[pieces.essentialaddons]
summary = "Extensión de Carpet con herramientas de admin y creativo, muchas portadas del plugin Essentials."

[pieces.fabric-api]
summary = "Los ganchos base que necesita casi cualquier mod de Fabric."

[pieces.fabric-language-kotlin]
summary = "Runtime para mods de Fabric escritos en Kotlin. Varios mods de aquí lo necesitan."

[pieces.fabricproxy-lite]
summary = "Reenvía los datos del jugador desde un proxy Velocity, para que un servidor detrás de uno conserve las identidades reales."

[pieces.ferritecore]
summary = "Baja el uso de memoria sin cambiar ningún comportamiento."

[pieces.g4mespeed]
summary = "Cambia la velocidad de tick de forma fiable y mantiene cliente y servidor sincronizados."

[pieces.gooderrails]
summary = "Port a lado servidor de las colocaciones de raíles mejoradas de MendedMinecarts."

[pieces.here]
summary = "Anuncia dónde estás, con un waypoint clicable para los que preguntan cada cinco minutos."

[pieces.intricarpet]
summary = "Extensión de Carpet enfocada a tecnología de TNT."

[pieces.invview]
summary = "Abre y edita inventarios y ender chests de jugadores conectados y desconectados."

[pieces.joacarpet]
summary = "Extensión pequeña de Carpet para redstone y almacenamiento, más algunos ajustes de survival."

[pieces.krypton]
summary = "Optimiza la pila de red, que es en lo que se le va el tiempo a un servidor con mucha gente."

[pieces.litematica]
summary = "Colocación e impresión de esquemáticos, la herramienta estándar para construir."

[pieces.litematica-server-paster]
summary = "Deja que Litematica pegue datos de bloques y entidades en un servidor."

[pieces.lithium]
summary = "Optimización de servidor que deja el comportamiento vanilla intacto."

[pieces.malilib]
summary = "Librería compartida de Litematica, MiniHUD y Tweakeroo."

[pieces.manke]
summary = "El bot de Discord que lleva MineWave. Público para que lo puedas leer, no empaquetado para que lo instales."
blurb = "El **bot de Discord** propio de MineWave: puente de chat, paneles de stats, roles, logs y más. Hecho por monos, para monos. 🐒 Público para leerlo, no empaquetado para instalarlo."

[pieces.mankedomath]
summary = "Una calculadora dentro del juego: cuentas rápidas en el chat, con unidades de Minecraft como stacks, shulkers y ticks."
blurb = "Una calculadora que **sabe lo que es una shulker box**. Ritmos de granja, cuentas de ítems y tiempos sin salir del juego, con stacks, shulker boxes, ticks y chunks como unidades de verdad: `5sb / 2h` te saca solo los ítems por hora."

[pieces.mankelist]
summary = "Lista de materiales de una construcción: /ml, un HUD encima y un tablero de Discord opcional que sigue el avance."
blurb = "Lista de materiales de lo que estés construyendo: `/ml`, un HUD encima y un tablero de Discord opcional que sigue lo que todavía falta."

[pieces.mcdreforged]
summary = "Wrapper de servidor en Python con plugins recargables en caliente. PyW4VE se mantiene compatible con sus plugins."

[pieces.minecraft-data-api]
summary = "Lee datos de jugador y NBT del servidor para otros plugins de MCDR."

[pieces.minimap-sync]
summary = "Sincronización de waypoints desde el servidor para Xaero's Minimap, mantenida compatible con las versiones actuales de Xaero."
blurb = "Sincronización de waypoints desde el servidor para Xaero's Minimap, que sigue funcionando con las versiones actuales de Xaero en vez de tumbarlas."

[pieces.multi-rcon-api]
summary = "Habla RCON con varios servidores a la vez. La base de los comandos entre servidores."

[pieces.online]
summary = "Lista quién está conectado en toda la red, no solo en este servidor."

[pieces.pca-protocol]
summary = "La mitad de servidor del protocolo PCA, para que los clientes puedan inspeccionar contenedores y entidades a distancia."

[pieces.primebackup]
summary = "Plugin de backups con deduplicación. Este fork recupera los botones de comando clicables que los clientes 1.20.5+ ignoran en silencio."
blurb = "Backups deduplicados para MCDR. Este fork devuelve los botones de comando clicables que los clientes 1.20.5+ ignoran en silencio."

[pieces.rconhush]
summary = "Mantiene la salida de los comandos por RCON fuera del log del servidor y fuera del chat."

[pieces.redstone-multimeter]
summary = "Mide los tiempos de la redstone tick a tick. Hace falta en los dos lados."

[pieces.regioncast]
summary = "Trae archivos de región del mundo de otro servidor a este, eligiéndolos en un mapa. También chunks sueltos, y los últimos cambios se pueden deshacer."
blurb = "Trae **archivos de región** del mundo de otro servidor a este, eligiéndolos en un mapa donde cada casilla es una región. También chunks sueltos, cuando una región entera es más de lo que querías, y los últimos cambios se pueden deshacer."

[pieces.ripdeepslate]
summary = "La deepslate se pica exactamente igual que la piedra con pico de netherita. Un solo jar, sin dependencias."
blurb = "La deepslate se pica **exactamente igual que la piedra** con pico de netherita, al instante con Eficiencia V y Prisa II. Sin bloques fantasma y sin animación de grieta."

[pieces.scalablelux]
summary = "Motor de luz basado en Starlight que abarata las actualizaciones de luz."

[pieces.schem-converter]
summary = "Bot de Discord que convierte archivos .litematic entre las versiones de NBT 4, 5, 6 y 7."
blurb = "Convierte archivos `.litematic` entre las versiones de NBT 4, 5, 6 y 7, para que los esquemáticos viejos abran en Litematica nuevo y al revés."

[pieces.server-replay]
summary = "Graba replays desde el servidor, para Replay Mod o Flashback, sin que nadie tenga que abrir un cliente."

[pieces.server-waypoint]
summary = "Waypoints del lado servidor que se sincronizan solos con Xaero's Minimap."

[pieces.servux]
summary = "Sirve datos de estructuras y entidades a Litematica y compañía."

[pieces.shapeboard]
summary = "Scoreboards para áreas de cualquier forma: la delimitas con bloques en el cielo, cuenta lo picado y lo colocado dentro, con sidebar por jugador."
blurb = "Scoreboards para áreas de **cualquier forma**, no solo cajas. Delimita la zona con bloques en el cielo, cada bloque roto o puesto dentro cuenta, y al entrar aparece una tabla en el sidebar con la clasificación por jugador."

[pieces.shulkerfix]
summary = "Evita que los proyectiles de shulker rompan los soportes para armaduras."

[pieces.spark]
summary = "Profiler para clientes, servidores y proxies. Lo primero que se instala cuando algo va lento y nadie sabe por qué."

[pieces.stackdeobf]
summary = "Traduce los stacktraces del log a nombres legibles, para que un crash report diga algo."

[pieces.statshelper]
summary = "Ayudante de estadísticas de Minecraft para MCDR, con los arreglos del lado de MineWave."
blurb = "Estadísticas de Minecraft para MCDR, con un arreglo de duplicados por UUID y por cambio de nombre encima del upstream."

[pieces.styled-chat]
summary = "Da formato al chat del servidor con placeholders y estilos por jugador, sin mod de cliente."

[pieces.syncmatica]
summary = "Comparte los esquemáticos de Litematica y sus colocaciones entre toda la gente del servidor."

[pieces.url-preview-api]
summary = "Trae las vistas previas de los enlaces para que las usen otros plugins."

[pieces.w4ve]
summary = "Un comando para instalar, actualizar y revisar cada pieza del ecosistema. El runtime de Python que envuelve el proceso del servidor y mantiene vivos los plugins de MCDR aterriza en el mismo repo."

[pieces.w4ve-core]
summary = "Librería Java compartida para los mods de W4VE: config con recarga en caliente, comandos, permisos, tableros de Discord y el enlace con PyW4VE."

[pieces.w4vecarpet]
summary = "Extensión de Carpet escrita para MineWave: comando de teleport rápido y una whitelist con zonas."

[pieces.wavemotes]
summary = "Escribes :emote: en el chat y lo eliges en un popup. Pack de emotes incluido y dibujado en el cliente, sin resource pack, más emojis de Discord opcionales."
blurb = "Escribes `:emote:` en el chat y eliges en un popup tipo `/`. Los emotes van dentro del jar y se dibujan en el cliente, más emojis de Discord opcionales."

[pieces.wavechat-server]
summary = "La mitad de servidor de WaveChat: imágenes en el chat, mandar capturas desde el juego, mensajes privados, emotes y música opcional, con Discord de invitado y no de centro."
blurb = "El lado del servidor, en un comando: imágenes en el chat, mandar capturas desde el juego, mensajes privados que te siguen entre servidores, y los emotes de tu comunidad. Discord es opcional, y la música también."

[pieces.where-is]
summary = "Pregunta dónde está otro jugador, con el mismo botón de waypoint."

[pieces.worldeaternotifier]
summary = "Vigila world eaters, trencheadoras y rompebedrock, y avisa por Discord cuando uno se para o se atasca."
blurb = "Vigila world eaters y trencheadoras y avisa por **Discord** cuando uno se para o se obstruye, con control de ping por evento para que solo te lleguen los avisos que quieres."

[pieces.worldedit]
summary = "El editor de mapas que corre dentro del juego: selecciones, esquemáticos, copiar y pegar, brochas."

[pieces.xaeros-minimap]
summary = "Minimapa con waypoints. Donde MinimapSync sincroniza las cosas."
