# W4VE registry - curated source
# =============================================================================
# This file is the ONLY thing a human edits. Everything a machine can find out
# on its own (release tags, download URLs, file hashes, Modrinth game versions)
# is added by build.py, which turns this into index.json.
#
# Edit it, run `python3 build.py`, done. If something looks wrong in the
# published catalog, the fix is here, in plain text, with comments.
#
# FIELD REFERENCE (per piece)
#   name          Display name.
#   summary       One line, English, what it does. This is the catalog copy.
#   blurb         Longer version for the org front page. Optional: without it
#                 the front page falls back to `summary`.
#   type          fabric-mod | mcdr-plugin | discord-bot | service | library |
#                 runtime | tool | datapack
#   side          server | client | both        (where the CLI installs it)
#   origin        w4ve   own code
#                 fork   someone else's code we maintain (keep `upstream`)
#                 external  not ours at all, listed so a server can be built
#   status        stable | beta | planned | infra | unreleased
#                 infra = "this runs our stuff, it is not a product"
#   install_dir   folder inside the server/instance where the file goes
#   requires      list of piece ids that must be present
#   conflicts     pieces known to break when installed together. Either a
#                 plain list of ids (any version with any version), or entries
#                 with versions, which is usually the truth:
#                   conflicts = [
#                     { with = "lithium", mine = ">=1.82", theirs = "<0.14",
#                       why = "Fabric refuses to boot" },
#                   ]
#                 `mine` and `theirs` are optional and default to any version.
#   mc            supported Minecraft range, semver-ish. Ranges, not lists,
#                 because listing every 1.21.x by hand is how Beaconator got
#                 four build pipelines.
#   mc_exclude    explicit holes in that range (versions we skipped)
#   repo          owner/name on GitHub
#   modrinth      Modrinth slug, when it is published there
#   docs          URL, when it has its own page
#   tags          used for GitHub topics, Modrinth categories and docs filters
# =============================================================================

schema = 1

[registry]
name = "W4VE"
tagline = "Ware 4 Vanilla Experience"
description = "Tools for technical Minecraft servers that do not break vanilla."
homepage = "https://w4ve.xyz/"
docs = "https://docs.w4ve.xyz/"
github_org = "CodeW4VE"

# Minecraft versions we promise to support. This is not decoration: releases of
# external pieces are pruned per target, so a 1.21 server can still install
# Fabric API after upstream has moved to 26.2. Add a version here and the next
# build keeps downloadable releases for it.
mc_targets = ["1.21", "1.21.1", "26.2"]

# Where the CLI prefers to download from, first match wins.
# Modrinth gives us a CDN, download counts and discovery for free; GitHub
# Releases is the fallback for anything Modrinth does not host (MCDR plugins,
# Discord bots, forks we do not want to publish there).
sources = ["modrinth", "github"]


