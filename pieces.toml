[pieces.beaconator]
name = "Beaconator"
summary = "Plan beacon perimeters: ring grid from one point, real coverage volumes, and beams where beacons are still missing."
blurb = "Plan a beacon perimeter before you place a single beacon: ring grid from one point, real coverage volumes, and beams shooting up where a beacon is still missing."
type = "fabric-mod"
side = "client"
origin = "w4ve"
status = "stable"
install_dir = "mods"
requires = ["fabric-api"]
mc = ">=1.21 <=26.1.2"
