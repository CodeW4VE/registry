# =============================================================================
# PROFILES - curated sets. "Install the technical profile and you have the
# stack" is easier to say than a list of fifteen links.
# =============================================================================

[profiles.technical-survival]
name = "Technical survival server"
description = "A vanilla-behaviour server for people who build farms and perimeters."
pieces = [
  "fabric-api", "carpet", "carpet-extra", "servux",
  "shapeboard", "worldeaternotifier", "regioncast", "rconhush",
  "mcdreforged", "minecraft-data-api", "primebackup", "statshelper",
]

[profiles.technical-client]
name = "Technical player client"
description = "What to put in your own instance to play on one of these servers."
pieces = [
  "fabric-api", "litematica", "malilib", "xaeros-minimap",
  "beaconator", "wavemotes", "mankelist",
]

[profiles.minewave]
name = "MineWave"
description = "Exactly what runs on the MineWave survival server. Kept honest: if it is not here, it is not on the server."
# Rewritten in August 2026 by reading the smp's own mods and plugins folders
# instead of trusting this list. What it taught us:
#   - The old list had `minimap-sync`, `regioncast`, `servux` and `wavemotes`,
#     none of which are on the smp. RegionCast lives on the mirror, WaveMotes is
#     a client mod, and waypoints are done by `server-waypoint`.
#   - Thirteen mods that ARE on the server were missing from here.
#   - `wavechat-server` is out on purpose: it is not something the smp drops in
#     a folder, it is a piece with a service of its own.
pieces = [
  # platform
  "fabric-api", "fabric-language-kotlin", "architectury-api",
  "carpet", "carpet-extra", "carpet-tis-addition", "essentialaddons",
  # performance and diagnostics
  "lithium", "krypton", "ferritecore", "scalablelux", "spark", "stackdeobf",
  # network
  "fabricproxy-lite", "bluemap",
  # technical play and building
  "chunk-debug", "pca-protocol", "server-replay", "invview", "syncmatica",
  "server-waypoint", "buildevents", "styled-chat", "deepslate-instamine",
  # ours
  "shapeboard", "mankelist", "worldeaternotifier", "ripdeepslate", "rconhush",
  # MCDR and its plugins
  "mcdreforged", "minecraft-data-api", "primebackup", "statshelper",
  "digall", "chatbridge", "here", "where-is", "online", "multi-rcon-api",
  "daycount-nbt", "beep", "command-suggest", "url-preview-api",
]
